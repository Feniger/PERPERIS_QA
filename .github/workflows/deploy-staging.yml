# PERPERIS QA — deploy private staging (QA-CLOUD-06, Neon variant).
# Manual only: Actions > "Deploy staging" > Run workflow. Never runs on pull requests.
# Uses keyless GitHub sign-in to Google (no service-account key). All settings come
# from the GitHub environment "staging"; see docs/QA-CLOUD-06-STAGING.md.
name: Deploy staging

on:
  workflow_dispatch:
    inputs:
      run_migrations:
        description: Apply database migrations before deploying
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: qa-staging-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 30
    env:
      REGION: ${{ vars.GCP_REGION || 'europe-north1' }}
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      SERVICE: ${{ vars.QA_SERVICE || 'perperis-qa-staging' }}
      IMAGE: ${{ vars.GCP_REGION || 'europe-north1' }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/perperis-qa/app
    steps:
      - name: Check required settings
        env:
          WIF: ${{ vars.GCP_WIF_PROVIDER }}
          DEPLOYER: ${{ vars.GCP_DEPLOYER_SA }}
          RUNTIME: ${{ vars.GCP_RUNTIME_SA }}
          BUCKET: ${{ vars.QA_BUCKET }}
          ORIGIN: ${{ vars.QA_ORIGIN }}
          WEB_KEY: ${{ vars.QA_IDENTITY_WEB_API_KEY }}
          HAS_MIGRATION_URL: ${{ secrets.QA_MIGRATION_DATABASE_URL != '' }}
        run: |
          missing=()
          for name in PROJECT_ID WIF DEPLOYER RUNTIME BUCKET ORIGIN WEB_KEY; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ "${{ inputs.run_migrations }}" = "true" ] && [ "$HAS_MIGRATION_URL" != "true" ]; then
            missing+=("secret QA_MIGRATION_DATABASE_URL")
          fi
          case "$ORIGIN" in https://*.run.app) ;; *) missing+=("QA_ORIGIN must be the https://...run.app address from setup.sh");; esac
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing staging settings: ${missing[*]}. See docs/QA-CLOUD-06-STAGING.md."
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Sign in to Google Cloud (keyless)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Build and push the image
        run: |
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          docker build --pull -t "$IMAGE:$GITHUB_SHA" .
          docker push "$IMAGE:$GITHUB_SHA"
          digest="$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:$GITHUB_SHA")"
          echo "DIGEST=$digest" >> "$GITHUB_ENV"
          echo "Image: $digest"

      - name: Apply database migrations (separate migration role)
        if: ${{ inputs.run_migrations }}
        env:
          PERPERIS_QA_DATABASE_URL: ${{ secrets.QA_MIGRATION_DATABASE_URL }}
        run: |
          docker run --rm --read-only --cap-drop ALL --security-opt no-new-privileges \
            -e PERPERIS_QA_DATABASE_URL "$IMAGE:$GITHUB_SHA" python -m database migrate --apply

      - name: Grant the app's database role least-privilege access
        if: ${{ inputs.run_migrations }}
        env:
          PERPERIS_QA_DATABASE_URL: ${{ secrets.QA_MIGRATION_DATABASE_URL }}
        run: |
          # One transaction; statements split on ';' (the SQL file keeps comments free of them).
          docker run --rm -i --read-only --cap-drop ALL --security-opt no-new-privileges \
            -e PERPERIS_QA_DATABASE_URL "$IMAGE:$GITHUB_SHA" python -c '
          import os, sys, psycopg
          sql = sys.stdin.read()
          statements = [s.strip() for s in sql.split(";")]
          statements = [s for s in statements if s and not all(l.strip().startswith("--") or not l.strip() for l in s.splitlines())]
          try:
              with psycopg.connect(os.environ["PERPERIS_QA_DATABASE_URL"], connect_timeout=15) as conn:
                  for s in statements:
                      conn.execute(s)
              print(f"Applied {len(statements)} grant statements.")
          except Exception as exc:
              # Never print the exception text: drivers may include connection details.
              print("Granting failed: check that the qa_runtime role exists in Neon. (" + type(exc).__name__ + ")")
              sys.exit(1)
          ' < infra/staging/runtime-grants.sql

      - name: Deploy to Cloud Run
        env:
          RUNTIME: ${{ vars.GCP_RUNTIME_SA }}
          BUCKET: ${{ vars.QA_BUCKET }}
          ORIGIN: ${{ vars.QA_ORIGIN }}
          WEB_KEY: ${{ vars.QA_IDENTITY_WEB_API_KEY }}
          ACCESS: ${{ vars.QA_PUBLIC_URL == 'false' && '--no-allow-unauthenticated' || '--allow-unauthenticated' }}
        run: |
          gcloud run deploy "$SERVICE" \
            --project "$PROJECT_ID" --region "$REGION" --image "$DIGEST" \
            --service-account "$RUNTIME" \
            --min-instances 0 --max-instances 2 --concurrency 4 --cpu 1 --memory 1Gi \
            --set-env-vars "PERPERIS_QA_ENV=staging,PERPERIS_QA_AUTH_MODE=identity,PERPERIS_QA_ORIGIN=$ORIGIN,PERPERIS_QA_IDENTITY_PROJECT=$PROJECT_ID,PERPERIS_QA_IDENTITY_WEB_API_KEY=$WEB_KEY,PERPERIS_QA_ATTACHMENT_BACKEND=gcs,PERPERIS_QA_ATTACHMENT_BUCKET=$BUCKET,PERPERIS_QA_CONCURRENCY=4,PERPERIS_QA_POOL_SIZE=3" \
            --set-secrets "PERPERIS_QA_DATABASE_URL=perperis-qa-database-url:latest,PERPERIS_QA_SECRET=perperis-qa-secret:latest" \
            $ACCESS
          url="$(gcloud run services describe "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --format 'value(status.url)')"
          echo "Deployed: $url"
          echo "### Staging deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "Open **$ORIGIN** (sign in with a verified, approved account)." >> "$GITHUB_STEP_SUMMARY"
